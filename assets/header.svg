    @keyframes b { 50% { opacity: 0; } }
    .l1 { animation: in .6s ease both .2s; }
    .l2 { animation: in .6s ease both .7s; }
    .l3 { animation: in .6s ease both 1.2s; }
    .l4 { animation: in .6s ease both 1.7s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</defs>
<rect width="1000" height="330" rx="14" fill="url(#bg)"/>
