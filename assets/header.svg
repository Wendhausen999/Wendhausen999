<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080F"/><stop offset="1" stop-color="#0A1A17"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00FF66"/><stop offset="1" stop-color="#00C2FF"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
    <stop offset="0" stop-color="#00FF66" stop-opacity="0.18"/><stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
